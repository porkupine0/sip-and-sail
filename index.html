  --scrim: rgba(4, 16, 26, .55);
  --shadow: 0 1px 2px rgba(11, 34, 51, .06), 0 8px 24px rgba(11, 34, 51, .08);
  --bt-bg: #06131d;
  --bt-ink: #ffffff;
  --bt-dim: #9fb4c3;
  --bt-accent: #f2c230;
  --font-display: "Limelight", "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
  --font-label: "Josefin Sans", "Futura", "Avenir Next", "Century Gothic", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07131c; --surface: #0e1f2c; --surface-2: #142a3a; --ink: #e7f0f4; --ink-2: #bfd0da;
    --muted: #8ca3b2; --line: #21384a; --navy: #0b2131; --navy-2: #14344b; --navy-ink: #eef5f8;
    --navy-muted: #9db5c4; --signal: #ff6b57; --signal-ink: #1c0805; --sea: #43c2d1; --sea-soft: #123a44;
    --flag: #f2c230; --brass: #e2b54e; --good: #5cc98a; --warn: #f0a63a; --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07131c; --surface: #0e1f2c; --surface-2: #142a3a; --ink: #e7f0f4; --ink-2: #bfd0da;
  --muted: #8ca3b2; --line: #21384a; --navy: #0b2131; --navy-2: #14344b; --navy-ink: #eef5f8;
  --navy-muted: #9db5c4; --signal: #ff6b57; --signal-ink: #1c0805; --sea: #43c2d1; --sea-soft: #123a44;
  --flag: #f2c230; --brass: #e2b54e; --good: #5cc98a; --warn: #f0a63a; --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: .01em; }
.eyebrow {
  font-family: var(--font-label); font-weight: 600; font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell ---------- */
.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: -16px; padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: env(safe-area-inset-top, 0px); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div { min-width: 0; }
.flags { display: flex; gap: 2px; flex: none; }
.flags svg { display: block; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.status-pill {
  flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink-2);
}
.status-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status-pill.ok i { background: var(--good); }
.icon-btn {
  flex: none; width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.icon-btn svg { width: 20px; height: 20px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button {
  height: var(--tabbar); border: 0; background: none; display: grid; justify-items: center; align-content: center;
  gap: 3px; color: var(--muted); font-size: 11px; font-family: var(--font-label); font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--signal); }
.tabs button[aria-current="page"] svg { stroke-width: 2.1; }

.view { padding-block: 16px 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.view > *, .split > *, .panel > * { min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.linkish { border: 0; background: none; color: var(--sea); font-weight: 600; padding: 4px 0; }

/* ---------- buttons & chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font-weight: 600; text-decoration: none;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn.sea { background: var(--sea); border-color: var(--sea); color: var(--surface); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.on { background: var(--sea-soft); border-color: var(--sea); color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  font-size: 14px; white-space: nowrap;
}
.chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"], .chip.inc { background: var(--sea); border-color: var(--sea); color: var(--surface); }
.chip[aria-pressed="true"] .n, .chip.inc .n { color: inherit; opacity: .8; }
.chip.exc { background: transparent; border-color: var(--signal); color: var(--signal); text-decoration: line-through; }
.chip.exc .n { color: inherit; }
.chip svg { width: 14px; height: 14px; }

/* ---------- home ---------- */
.hero {
  background: var(--navy); color: var(--navy-ink); border-radius: 20px; padding: 20px; display: grid; gap: 14px;
  position: relative; overflow: hidden;
}
.hero .eyebrow { color: var(--navy-muted); }
.hero h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 7vw, 34px); line-height: 1.05; }
.hero p { color: var(--navy-muted); }
.hero .chip { background: transparent; color: var(--navy-ink); border-color: var(--navy-2); }
.hero .chip[aria-pressed="true"] { background: var(--navy-ink); color: var(--navy); border-color: var(--navy-ink); }
.hero .chips { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hero-cta .btn.primary { min-height: 52px; font-size: 17px; padding-inline: 22px; }
.wave { position: absolute; right: -10px; top: 12px; width: 150px; opacity: .14; color: var(--navy-ink); pointer-events: none; }

.split { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .split { grid-template-columns: 1fr; } }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
  display: grid; gap: 10px; align-content: start; text-align: left; min-width: 0;
}
button.tile { width: 100%; }
.tile h3 { font-size: 17px; }
.tile .tile-top { display: flex; align-items: center; gap: 12px; }
.quiz-tile { background: var(--flag); border-color: var(--flag); color: #1b1606; }
.quiz-tile .eyebrow { color: #5a4708; }
.quiz-tile .display { font-size: 24px; line-height: 1.1; }

.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.dcard {
  flex: none; width: 148px; scroll-snap-align: start; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r); padding: 12px; display: grid; gap: 6px; align-content: start; text-align: left;
}
.dcard .gl { color: var(--ink); }
.dcard b { font-size: 14px; line-height: 1.25; }
.dcard span { font-size: 12px; color: var(--muted); }

.must-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tally > div { background: var(--surface); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.tally b { font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tally span { font-size: 12px; color: var(--muted); }

/* ---------- rows ---------- */
.rows { display: grid; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 10px 2px;
  border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; min-width: 0;
}
.row:active { background: var(--surface-2); }
.row-main { display: grid; min-width: 0; gap: 1px; }
.row-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.row-name .mk { font-size: 12px; margin-left: 4px; vertical-align: 1px; }
.row-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-side { display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted); }
.mk-fav { color: var(--signal); }
.mk-must { color: var(--brass); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); display: block; }
.dots i.f { background: var(--ink-2); border-color: var(--ink-2); }
.zero-badge { font-family: var(--font-label); font-weight: 600; font-size: 11px; letter-spacing: .08em; color: var(--good); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; }
.gl { display: block; color: var(--ink); overflow: visible; }
.gl-cup { fill: var(--surface); }
.gl-o { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; opacity: .78; }

/* ---------- browse ---------- */
.searchbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h, 61px)); z-index: 15; background: var(--bg);
  margin-inline: -16px; padding: 10px 16px 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; border-bottom: 1px solid var(--line);
}
.searchbar > * { min-width: 0; }
.search { display: flex; gap: 8px; }
.search label { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-width: 0; }
.search label svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; outline: none; height: 44px; flex: 1; width: 100%; min-width: 0; font-size: 16px; }
.filter-btn { position: relative; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--signal); color: var(--signal-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.result-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.result-bar select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 8px; min-height: 36px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.more-sentinel { padding: 18px; text-align: center; color: var(--muted); }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* ---------- sheets ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.panel {
  background: var(--bg); color: var(--ink); width: 100%; max-width: 680px; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px));
  border-radius: 20px 20px 0 0; overflow-y: auto; overscroll-behavior: contain; box-shadow: var(--shadow);
  padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px));
  animation: rise .24s cubic-bezier(.2, .8, .2, 1);
}
@media (min-width: 720px) { .overlay { align-items: center; } .panel { border-radius: 20px; max-height: 88vh; } }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.panel-bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0 8px; background: var(--bg); }
.panel-bar .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin-inline: auto; }
.panel h3 { font-size: 13px; font-family: var(--font-label); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 20px; margin-bottom: 8px; }

.dt-head { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.dt-head h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 7vw, 34px); line-height: 1.05; }
.dt-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 6px; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.must-note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--flag); background: color-mix(in srgb, var(--flag) 16%, var(--surface)); font-size: 14px; }
.must-note b { color: var(--brass); }
.know { font-size: 13px; margin-top: 10px; display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.know i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.know.rare i { background: var(--warn); }
.dt-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.dt-actions .btn.wide { grid-column: 1 / -1; min-height: 52px; font-size: 16px; }
.dt-note { margin-top: 14px; color: var(--ink-2); }
.ing { display: grid; border-top: 1px solid var(--line); }
.ing li { list-style: none; display: grid; grid-template-columns: minmax(76px, auto) 1fr auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.ing ul, ul.ing { padding: 0; margin: 0; }
.ing .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ing .ml { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ing .opt { color: var(--muted); font-size: 12px; }
.ing .mod { color: var(--muted); }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 10px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.say { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; }
.say p:last-child { font-size: 15px; }
.rate { display: grid; gap: 10px; }
.stars { display: flex; gap: 4px; }
.stars button { width: 44px; height: 44px; border: 0; background: none; padding: 0; color: var(--line); display: grid; place-items: center; }
.stars button.on { color: var(--brass); }
.stars svg { width: 30px; height: 30px; }
.field { display: grid; gap: 6px; font-size: 14px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; font-size: 16px;
}
.field textarea { min-height: 76px; resize: vertical; }
.saved-hint { font-size: 12px; color: var(--good); min-height: 18px; }

/* ---------- bartender card ---------- */
.bt {
  position: fixed; inset: 0; z-index: 70; background: var(--bt-bg); color: var(--bt-ink); overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px));
}
.bt-in { max-width: 820px; margin: 0 auto; display: grid; gap: 16px; }
.bt-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.bt .seg { background: transparent; border-color: #2a4152; }
.bt-top .seg button { color: var(--bt-ink); border-color: #2a4152; }
.bt-top .seg button[aria-pressed="true"] { background: var(--bt-ink); color: var(--bt-bg); }
.bt-close { min-height: 44px; border-radius: 12px; border: 1px solid #2a4152; background: transparent; color: var(--bt-ink); padding: 8px 16px; font-weight: 700; }
.bt-ask { font-family: var(--font-label); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--bt-accent); font-size: 14px; }
.bt-name { font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 10vw, 64px); line-height: 1; }
.bt-sub { color: var(--bt-dim); font-size: 18px; }
.bt-ing { width: 100%; border-collapse: collapse; font-size: clamp(20px, 5.4vw, 30px); }
.bt-ing td { padding: 10px 0; border-bottom: 1px solid #1d3242; vertical-align: baseline; }
.bt-ing td.a { font-weight: 800; white-space: nowrap; padding-right: 18px; font-variant-numeric: tabular-nums; color: var(--bt-accent); }
.bt-ing small { display: block; font-size: .55em; color: var(--bt-dim); font-weight: 500; }
.bt-steps { font-size: clamp(17px, 4.4vw, 22px); padding-left: 26px; margin: 0; display: grid; gap: 8px; }
.bt-garnish { font-size: clamp(17px, 4.4vw, 22px); }
.bt-thanks { font-family: var(--font-display); font-size: 28px; color: var(--bt-accent); }

/* ---------- surprise ---------- */
.spin-panel { background: var(--navy); color: var(--navy-ink); width: min(520px, calc(100% - 32px)); border-radius: 22px; padding: 22px; margin: auto; display: grid; gap: 14px; text-align: center; box-shadow: var(--shadow); }
.spin-overlay { align-items: center; padding-inline: 16px; }
.spin-panel .eyebrow { color: var(--navy-muted); }
.reel { height: 92px; display: grid; place-items: center; border-radius: 14px; background: var(--navy-2); overflow: hidden; }
.reel span { font-family: var(--font-display); font-size: clamp(22px, 6vw, 30px); line-height: 1.1; padding: 0 12px; }
.spin-result { display: grid; gap: 12px; justify-items: center; }
.spin-result .gl { color: var(--navy-ink); }
.spin-result h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; }
.spin-result p { color: var(--navy-muted); }
.spin-result .btn { border-color: var(--navy-2); background: transparent; color: var(--navy-ink); }
.spin-result .btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }

/* ---------- quiz ---------- */
.quiz-card { display: grid; gap: 16px; }
.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.progress i.f { background: var(--signal); }
.quiz-q { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 7vw, 32px); line-height: 1.1; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 12px; min-height: 84px;
  display: grid; gap: 4px; align-content: center; justify-items: start; text-align: left; font-weight: 600;
}
.answer .e { font-size: 26px; line-height: 1; }
.answer[aria-pressed="true"] { border-color: var(--signal); box-shadow: inset 0 0 0 2px var(--signal); }
.match {
  background: var(--navy); color: var(--navy-ink); border-radius: 20px; padding: 18px; display: grid; gap: 12px;
  grid-template-columns: 88px 1fr; align-items: center;
}
.match .gl { color: var(--navy-ink); }
.match .eyebrow { color: var(--flag); }
.match h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; }
.match p { color: var(--navy-muted); font-size: 14px; }
.match .btn-row { grid-column: 1 / -1; }
.match .btn { background: transparent; color: var(--navy-ink); border-color: var(--navy-2); }
.match .btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.why { display: flex; flex-wrap: wrap; gap: 6px; }
.why span { font-size: 12px; border-radius: 999px; padding: 2px 9px; background: var(--navy-2); color: var(--navy-ink); }

/* ---------- my bar ---------- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 12px; min-height: 40px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.full { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
.seg.full button { padding: 8px 4px; font-size: 13px; }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.daynav b { font-size: 16px; }
.meter { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 6px; }
.nudge { border-radius: 12px; padding: 10px 12px; background: var(--sea-soft); color: var(--ink); font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.quick .btn { font-size: 14px; padding-inline: 10px; }
.log-row { display: grid; grid-template-columns: 54px 36px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log-row time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-row .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-row .pr { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-row button.x { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.shop-group { display: grid; gap: 2px; }
.shop-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.shop-item input { width: 22px; height: 22px; accent-color: var(--sea); flex: none; }
.shop-item span { flex: 1; }
.shop-item small { color: var(--muted); }
.shop-item.done span { text-decoration: line-through; color: var(--muted); }

/* ---------- guide ---------- */
.acc { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); overflow: hidden; }
.acc + .acc { margin-top: 10px; }
.acc summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 16px; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .chev { transition: transform .2s; color: var(--muted); flex: none; }
.acc[open] summary .chev { transform: rotate(180deg); }
.acc .body { padding: 0 16px 16px; display: grid; gap: 12px; }
.acc .body p, .acc .body li { max-width: 68ch; }
.facts-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.facts-list li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.facts-list li svg { width: 18px; height: 18px; margin-top: 2px; color: var(--sea); }
.facts-list li.no svg { color: var(--signal); }
.bigfig { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bigfig b { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1; color: var(--signal); }
.bar-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.bar-item { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.bar-item b { font-size: 15px; }
.bar-item p { font-size: 14px; color: var(--ink-2); }
.linkrow { display: flex; flex-wrap: wrap; gap: 6px; }
.linkrow button { border: 0; background: var(--sea-soft); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 13px; min-height: 32px; }
.port { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.port h4 { margin: 0; font-size: 15px; }
.port .where { font-size: 12px; color: var(--muted); }
.port ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.port li { font-size: 14px; color: var(--ink-2); }
.port li button { border: 0; background: none; padding: 0; color: var(--sea); font-weight: 700; text-align: left; }
.port li b { color: var(--ink); }
.gloss { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
.gloss dt { font-weight: 700; }
.gloss dd { margin: 0; color: var(--ink-2); }
.settings-grid { display: grid; gap: 14px; }
.price-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.foot { font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0 4px; max-width: 60ch; margin-inline: auto; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px));
  z-index: 80; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center;
  box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 14px;
}
.toast button { border: 0; background: none; color: var(--flag); font-weight: 700; padding: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

  const METHODS = {
    sh: 'Shaken, served up', shr: 'Shaken, on the rocks', shd: 'Shaken, poured with the ice',
    st: 'Stirred, served up', str: 'Stirred, on the rocks', bu: 'Built over ice', bn: 'Built, no ice',
    bl: 'Blended', mu: 'Muddled', mus: 'Muddled & shaken', ly: 'Layered', hot: 'Served hot',
    sw: 'Swizzled', sht: 'Shaken shot', po: 'Poured'
  };
  const MUDDLE = new Set(['mint', 'basil', 'rosemary', 'cucumber', 'jalapeno', 'limewedge', 'lemonwedge',
    'orangeslice', 'cherry', 'straw', 'raspberries', 'blackberries', 'blueberries', 'pinechunk', 'melon',
    'ginger', 'sugar']);
  // How strongly a creamy ingredient whitens (scatters) a drink, for the color model.
  const CREAMY = { cream: 1, milk: .9, icecream: .85, cococream: .85, 'coconut-milk': .8, condensed: .8,
    baileys: .65, rumchata: .7, godiva: .35, trose: .55, eggwhite: .35, sorbet: .6, banana: .5, whipped: 0 };
  const DEFAULT_TOP = { wine: 3, beer: 8, mixer: 3.5, coffee: 4, juice: 3 };
  const STD_OZ = 0.6; // US standard drink = 0.6 fl oz of pure alcohol
  const STRENGTH = ['Zero-proof', 'Light', 'Medium', 'Strong', 'Very strong'];

  const FLAVOR_LABELS = {
    sweet: 'Sweet', tart: 'Tart', fruity: 'Fruity', tropical: 'Tropical', creamy: 'Creamy',
    coconut: 'Coconut', bitter: 'Bitter', fresh: 'Refreshing', herbal: 'Herbal', minty: 'Minty',
    citrus: 'Citrusy', spicy: 'Spicy', ginger: 'Ginger', bubbly: 'Bubbly', coffee: 'Coffee',
    choc: 'Chocolate', nutty: 'Nutty', berry: 'Berry', floral: 'Floral', smoky: 'Smoky',
    savory: 'Savory', dry: 'Dry', dessert: 'Dessert', anise: 'Anise', brunch: 'Brunch',
    elegant: 'Elegant', fun: 'Party', strong: 'Boozy', frozen: 'Frozen', hot: 'Warm'
  };

  const AMT = [
    [/^(\d*\.?\d+)$/, m => ({ t: 'oz', n: +m[1] })],
    [/^d(\d+)$/, m => ({ t: 'dash', n: +m[1] })],
    [/^sp$/, () => ({ t: 'splash' })],
    [/^top(\d*\.?\d*)$/, m => ({ t: 'top', n: m[1] ? +m[1] : 0 })],
    [/^b(\d*\.?\d+)$/, m => ({ t: 'bsp', n: +m[1] })],
    [/^t(\d*\.?\d+)$/, m => ({ t: 'tsp', n: +m[1] })],
    [/^x(\d+)$/, m => ({ t: 'count', n: +m[1] })],
    [/^sc(\d+)$/, m => ({ t: 'scoop', n: +m[1] })],
    [/^rim$/, () => ({ t: 'rim' })],
    [/^f(\d*\.?\d+)$/, m => ({ t: 'float', n: +m[1] })],
    [/^rinse$/, () => ({ t: 'rinse' })],
    [/^pinch$/, () => ({ t: 'pinch' })]
  ];

  function slug(s) {
    return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’]/g, '');
  }

  function parseIngredients(text) {
    const ING = {};
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line || line[0] === '#') continue;
      const [key, name, group, fam, abv, color, pig, uv, flags] = line.split('|');
      const [sing, plur] = name.split('/');
      ING[key] = {
        key, name: sing, plural: plur || sing, group, fam, abv: +abv || 0, color: '#' + color,
        pig: +pig || 0, uv: +uv || 0, flags: new Set((flags || '').split(/\s+/).filter(Boolean))
      };
    }
    return ING;
  }

  function parseAmount(tok) {
    for (const [re, f] of AMT) { const m = tok.match(re); if (m) return f(m); }
    return null;
  }

  function parseItem(tok, ING, errors, where) {
    let s = tok.trim(), opt = false;
    if (s[0] === '?') { opt = true; s = s.slice(1); }
    const sp = s.indexOf(' ');
    const amtTok = sp < 0 ? s : s.slice(0, sp);
    let rest = sp < 0 ? '' : s.slice(sp + 1).trim();
    let mod = '';
    const c = rest.indexOf(':');
    if (c >= 0) { mod = rest.slice(c + 1).trim(); rest = rest.slice(0, c).trim(); }
    const a = parseAmount(amtTok);
    if (!a) errors.push(`${where}: bad amount "${amtTok}"`);
    if (!ING[rest]) errors.push(`${where}: unknown ingredient "${rest}"`);
    return { key: rest, a: a || { t: 'oz', n: 0 }, mod, opt };
  }

  function itemVol(it, ing) {
    const a = it.a;
    switch (a.t) {
      case 'oz': case 'float': return a.n;
      case 'dash': return a.n * 0.03;
      case 'splash': return 0.25;
      case 'top': return a.n || DEFAULT_TOP[ing.group] || 0;
      case 'bsp': case 'tsp': return a.n * 0.17;
      case 'count': return a.n * ing.uv;
      case 'scoop': return a.n * 2;
      case 'rinse': return 0.05;
      default: return 0;
    }
  }

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(c) {
    return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }

  // Weighted subtractive mixing: the pigment mix sets the hue, pigment coverage sets how
  // deep it looks, creamy ingredients whiten it, and clear volume tints toward glass.
  function mixColor(items, ING) {
    let V = 0, S = 0, cream = 0;
    const A = [0, 0, 0];
    for (const it of items) {
      if (it.opt || it.a.t === 'rim' || it.a.t === 'rinse') continue;
      const ing = ING[it.key];
      const v = itemVol(it, ing);
      if (!v) continue;
      V += v;
      if (ing.pig > 0) {
        const c = hexToRgb(ing.color), w = v * ing.pig;
        S += w;
        for (let k = 0; k < 3; k++) A[k] += w * -Math.log(Math.max(c[k] / 255, 0.03));
      }
      if (CREAMY[it.key]) cream += v * CREAMY[it.key];
    }
    if (!V) return '#e6eef1';
    const D = S ? Math.min(1, S / (V * 0.55)) : 0;
    const depth = Math.pow(D, 0.75);
    let rgb = S ? A.map(a => 255 * Math.exp(-(a / S) * depth)) : [255, 255, 255];
    const w = Math.min(0.72, (cream / V) * 1.45);
    if (w > 0) {
      const white = [247, 240, 228];
      rgb = rgb.map((v, k) => v * (1 - w) + white[k] * w);
    }
    const t = (1 - D) * 0.55, tint = [226, 238, 242];
    rgb = rgb.map((v, k) => v * (1 - t) + tint[k] * t);
    return rgbToHex(rgb);
  }

  function parseData(ingText, recipeText, listText) {
    const ING = parseIngredients(ingText);
    const errors = [];
    const recipes = [];
    const byName = new Map();
    let cat = null;
    recipeText.split('\n').forEach((raw, ln) => {
      const line = raw.trim();
      if (!line || line[0] === '#') return;
      if (line.startsWith('@cat ')) { cat = line.slice(5).trim(); if (!CATS[cat]) errors.push(`bad cat ${cat}`); return; }
      const parts = line.split('|');
      if (parts.length !== 7) { errors.push(`line ${ln + 1}: expected 7 fields, got ${parts.length}: ${line.slice(0, 60)}`); return; }
      const [name, tagStr, glass, method, ingStr, garnish, note] = parts;
      const where = name;
      if (!GLASSES[glass]) errors.push(`${where}: unknown glass ${glass}`);
      if (!METHODS[method]) errors.push(`${where}: unknown method ${method}`);
      const items = ingStr.split(';').filter(Boolean).map(t => parseItem(t, ING, errors, where));
      const tags = new Set(tagStr.split(',').map(s => s.trim()).filter(Boolean));
      let color = null;
      for (const t of [...tags]) if (t[0] === '#') { color = t; tags.delete(t); }
      const r = { name, cat, tags, glass, method, items, garnish: garnish === 'No garnish' ? '' : garnish, note, color };
      if (byName.has(norm(name))) errors.push(`duplicate drink name: ${name}`);
      byName.set(norm(name), r);
      recipes.push(r);
    });

    const ids = new Set();
    for (const r of recipes) {
      let id = slug(r.name), n = 2;
      while (ids.has(id)) id = slug(r.name) + '-' + n++;
      ids.add(id);
      r.id = id;
      derive(r, ING);
    }

    // Lists: @must <section> then "Name|why"; @coco then names
    const must = [], coco = [];
    let mode = null, section = null;
    (listText || '').split('\n').forEach(raw => {
      const line = raw.trim();
      if (!line || line[0] === '#') return;
      if (line.startsWith('@must')) { mode = 'must'; section = { title: line.slice(5).trim(), items: [] }; must.push(section); return; }
      if (line.startsWith('@coco')) { mode = 'coco'; return; }
      if (mode === 'must') {
        const [name, why] = line.split('|');
        const r = byName.get(norm(name));
        if (!r) { errors.push(`must-try: unknown drink ${name}`); return; }
        r.must = true; r.mustWhy = why; r.mustSection = section.title;
        section.items.push(r);
      } else if (mode === 'coco') {
        const r = byName.get(norm(line));
        if (!r) { errors.push(`coco: unknown drink ${line}`); return; }
        coco.push(r);
      }
    });
    return { ING, recipes, byName, must, coco, errors };
  }

  function derive(r, ING) {
    let alc = 0, vol = 0;
    const fams = new Set(), keys = new Set();
    const ctags = new Set();
    const spiritAlc = {}, anyAlc = {};
    let citrusVol = 0;
    for (const it of r.items) {
      const ing = ING[it.key];
      if (!ing) continue;
      if (!it.opt) { keys.add(it.key); fams.add(ing.fam); }
      if (it.opt) continue;
      const v = itemVol(it, ing);
      vol += v;
      const a = v * ing.abv / 100;
      alc += a;
      if (a > 0) {
        anyAlc[ing.fam] = (anyAlc[ing.fam] || 0) + a;
        if (ing.group === 'spirit') spiritAlc[ing.fam] = (spiritAlc[ing.fam] || 0) + a;
      }
      const f = ing.flags;
      const big = v >= 0.25 || it.a.t === 'count' || it.a.t === 'top' || it.a.t === 'scoop' || it.a.t === 'rim';
      if (f.has('coconut')) ctags.add('coconut');
      if ((f.has('creamy') || f.has('dairy')) && v >= 0.75 && it.key !== 'whipped') ctags.add('creamy');
      if (f.has('nut') && v >= 0.25) ctags.add('nutty');
      if (f.has('choc') && v >= 0.25) ctags.add('choc');
      if (f.has('coffee') && v >= 0.25) ctags.add('coffee');
      if (f.has('minty') && (v >= 0.25 || (it.a.t === 'count' && it.a.n >= 4))) ctags.add('minty');
      if (f.has('bubbly') && big) ctags.add('bubbly');
      if (f.has('smoky')) ctags.add('smoky');
      if (f.has('spicy') && (big || it.a.t === 'dash' || it.a.t === 'pinch')) ctags.add('spicy');
      if (f.has('ginger') && big) ctags.add('ginger');
      if (f.has('herbal') && (v >= 0.25 || (it.a.t === 'count' && it.a.n >= 4))) ctags.add('herbal');
      if (f.has('floral') && (v >= 0.25 || it.a.t === 'dash')) ctags.add('floral');
      if (f.has('berry') && big) ctags.add('berry');
      if (f.has('anise') && v >= 0.25) ctags.add('anise');
      if (f.has('bitter') && v >= 0.5) ctags.add('bitter');
      if (f.has('tropical') && v >= 0.5) ctags.add('tropical');
      if (f.has('citrus') && it.a.t !== 'rim') citrusVol += v;
    }
    if (citrusVol >= 0.5) ctags.add('citrus');
    if (r.method === 'bl') ctags.add('frozen');
    if (r.method === 'hot') ctags.add('hot');
    r.std = alc / STD_OZ;
    r.vol = vol;
    r.zero = r.std < 0.15;
    r.strength = r.zero ? 0 : r.std < 0.9 ? 1 : r.std < 1.5 ? 2 : r.std < 2.2 ? 3 : 4;
    if (r.strength >= 3) ctags.add('strong');
    for (const t of ctags) r.tags.add(t);
    if (r.zero) r.tags.delete('strong');
    r.frozen = r.method === 'bl';
    r.fams = fams;
    r.keys = keys;
    const pick = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0];
    const sp = pick(spiritAlc), an = pick(anyAlc);
    r.base = sp ? sp[0] : an ? an[0] : 'Zero-proof';
    r.color = r.color || mixColor(r.items, ING);
    const names = r.items.filter(i => !i.opt && ING[i.key] && i.a.t !== 'rim').map(i => ING[i.key].name + ' ' + ING[i.key].fam + ' ' + i.mod);
    r.search = norm([r.name, r.base, CATS[r.cat], names.join(' '), [...r.tags].map(t => FLAVOR_LABELS[t] || t).join(' '), r.garnish].join(' '));
  }

  // ---------- formatting ----------
  const FR = { 0.25: '¼', 0.5: '½', 0.75: '¾', 0.33: '⅓', 0.67: '⅔' };
  function frac(n) {
    const w = Math.floor(n + 1e-9);
    const f = Math.round((n - w) * 100) / 100;
    if (!f) return String(w);
    if (FR[f]) return (w || '') + FR[f];
    return String(Math.round(n * 100) / 100);
  }
  function ml(n) {
    const v = n * 30;
    return (Math.round(v * 2) / 2).toString().replace(/\.0$/, '');
  }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function lc(s) { return s ? s[0].toLowerCase() + s.slice(1) : s; }

  // Returns {amt, ml, name} for display. units: 'both' | 'oz' | 'ml'
  function fmtItem(it, ING, units) {
    const ing = ING[it.key];
    const a = it.a;
    let name = ing.name;
    let mod = it.mod;
    if (mod && mod[0] === '=') { name = mod.slice(1); mod = ''; }
    else if (mod && !/^or |^as /.test(mod)) name = name.replace(/ \(.*\)$/, '');
    let amt = '', mlTxt = '';
    const oz = n => {
      if (units === 'ml') return { amt: ml(n) + ' ml', ml: '' };
      if (units === 'oz') return { amt: frac(n) + ' oz', ml: '' };
      return { amt: frac(n) + ' oz', ml: ml(n) + ' ml' };
    };
    switch (a.t) {
      case 'oz': ({ amt, ml: mlTxt } = oz(a.n)); break;
      case 'float': { const o = oz(a.n); amt = 'Float ' + o.amt; mlTxt = o.ml; break; }
      case 'dash': amt = a.n + ' ' + plural(a.n, 'dash', 'dashes'); break;
      case 'splash': amt = 'Splash'; break;
      case 'top': if (a.n) { const o = oz(a.n); amt = 'Top · ' + o.amt; mlTxt = o.ml; } else amt = 'Top with'; break;
      case 'bsp': amt = frac(a.n) + ' ' + plural(a.n, 'barspoon', 'barspoons'); break;
      case 'tsp': amt = frac(a.n) + ' tsp'; break;
      case 'count':
        amt = String(a.n);
        name = (it.mod && it.mod[0] === '=') ? name : (a.n === 1 ? ing.name : ing.plural);
        break;
      case 'scoop': amt = a.n + ' ' + plural(a.n, 'scoop', 'scoops'); break;
      case 'rim': amt = 'Rim'; break;
      case 'rinse': amt = 'Rinse'; break;
      case 'pinch': amt = 'Pinch'; break;
    }
    return { amt, ml: mlTxt, name, mod, opt: it.opt };
  }

  function itemPlain(it, ING, units) {
    const f = fmtItem(it, ING, units);
    return `${f.amt} ${f.name}${f.mod ? ' (' + f.mod + ')' : ''}${f.ml ? ' [' + f.ml + ']' : ''}${f.opt ? ' (optional)' : ''}`;
  }

  function shortName(it, ING) {
    const ing = ING[it.key];
    if (it.mod && it.mod[0] === '=') return lc(it.mod.slice(1));
    if (it.a.t === 'count') return lc(ing.plural);
    return lc(ing.name.replace(/ \(.*\)$/, ''));
  }
  function list(arr) {
    if (arr.length < 2) return arr.join('');
    return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  }

  function steps(r, ING, units) {
    const out = [];
    const g = GLASSES[r.glass] || 'glass';
    const by = t => r.items.filter(i => i.a.t === t);
    const rims = by('rim'), rinses = by('rinse'), tops = by('top'), floats = by('float');
    const muddled = r.items.filter(i => MUDDLE.has(i.key) && (i.a.t === 'count' || i.key === 'sugar'));
    const up = UP_GLASSES.has(r.glass);
    if (rims.length) out.push(`Rim the ${g} with ${list(rims.map(i => shortName(i, ING)))}${rims.every(i => i.opt) ? ' (optional)' : ''}.`);
    if (rinses.length) out.push(`Rinse the chilled ${g} with a little ${list(rinses.map(i => shortName(i, ING)))}, then discard the excess.`);
    const mud = list(muddled.map(i => shortName(i, ING))) || 'fruit';
    switch (r.method) {
      case 'sh': out.push(`Shake hard with ice for 10–12 seconds, then strain into a chilled ${g}.`); break;
      case 'shr': out.push(`Shake hard with ice, then strain over fresh ice in a ${g}.`); break;
      case 'shd': out.push(`Shake with crushed ice and pour everything, ice and all, into a ${g}.`); break;
      case 'st': out.push(`Stir with ice until very cold (about 20 seconds), then strain into a chilled ${g}.`); break;
      case 'str': out.push(`Stir with ice, then strain over a large ice cube in a ${g}.`); break;
      case 'bu': out.push(`Fill a ${g} with ice, add the ingredients in order and stir gently.`); break;
      case 'bn': out.push(`Add the ingredients to a ${g} in order, without ice, and stir gently.`); break;
      case 'bl': out.push(`Blend with about a cup of ice until smooth, then pour into a ${g}.`); break;
      case 'mu': out.push(`Gently muddle the ${mud} in a ${g}. Fill with ice (crushed if possible), add the rest and stir.`); break;
      case 'mus': out.push(`Muddle the ${mud} in a shaker. Add the rest with ice, shake hard and ${up ? `double-strain into a chilled ${g}` : `strain over fresh ice in a ${g}`}.`); break;
      case 'ly': out.push(`Layer in the order listed: pour each one slowly over the back of a spoon into a ${g}.`); break;
      case 'hot': out.push(`Build in a warmed ${g} and stir to combine.`); break;
      case 'sw': out.push(`Build over crushed ice in a ${g}, then swizzle (or stir hard) until the glass frosts.`); break;
      case 'sht': out.push(`Shake with ice and strain into a ${g}.`); break;
      case 'po': out.push(`Pour into a ${g}.`); break;
    }
    if (tops.length) out.push(`Top with ${list(tops.map(i => shortName(i, ING)))}.`);
    if (floats.length) out.push(`Float ${list(floats.map(i => fmtItem(i, ING, units).amt.replace('Float ', '') + ' ' + shortName(i, ING)))} on top.`);
    return out;
  }

  const ORDER_METHOD = {
    sh: 'shaken and served up', shr: 'shaken and served over ice', shd: 'shaken and poured over crushed ice',
    st: 'stirred and served up', str: 'stirred and served over ice', bu: 'built over ice', bn: 'served without ice',
    bl: 'blended with ice', mu: 'muddled and served over crushed ice', mus: 'muddled and shaken', ly: 'layered',
    hot: 'served hot', sw: 'swizzled over crushed ice', sht: 'as a shot', po: 'poured neat'
  };
  const RIM_WORDS = { salt: 'salt', sugar: 'sugar', tajin: 'Tajín', toastedcoco: 'toasted-coconut',
    celerysalt: 'celery-salt', graham: 'graham-cracker', cinnsugar: 'cinnamon-sugar', sprinkles: 'sprinkle' };
  const GROUP_ORDER = ['spirit', 'liqueur', 'wine', 'beer', 'juice', 'syrup', 'dairy', 'coffee', 'fresh', 'mixer', 'accent'];
  function orderLine(r, ING) {
    const main = r.items.filter(i => !i.opt && !['rim', 'dash', 'rinse', 'pinch'].includes(i.a.t) && ING[i.key].group !== 'accent')
      .sort((a, b) => GROUP_ORDER.indexOf(ING[a.key].group) - GROUP_ORDER.indexOf(ING[b.key].group));
    const names = main.map(i => {
      const g = ING[i.key].group;
      if (i.mod && i.mod[0] !== '=' && !/^or |^as |e\.g\.| if |freshly|chilled|ice-cold|steamed|cold|hot/.test(i.mod) && (g === 'spirit' || g === 'liqueur')) return i.mod;
      return shortName(i, ING).replace(/^fresh (lime|lemon) juice$/, 'fresh $1');
    });
    const rims = r.items.filter(i => i.a.t === 'rim' && !i.opt).map(i => RIM_WORDS[i.key] || shortName(i, ING));
    let s = `Could I get a ${r.name}? It's ${list(names)}, ${ORDER_METHOD[r.method]}`;
    if (rims.length) s += `, with a ${list(rims)} rim`;
    return s + '.';
  }

  function recipeText(r, ING, units) {
    const lines = [r.name.toUpperCase(), ''];
    for (const it of r.items) lines.push('• ' + itemPlain(it, ING, units));
    lines.push('');
    steps(r, ING, units).forEach((s, i) => lines.push(`${i + 1}. ${s}`));
    if (r.garnish) lines.push(`Garnish: ${r.garnish}`);
    return lines.join('\n');
  }

  // Similarity for "you might also like"
  function similar(r, all, n) {
    const out = [];
    for (const o of all) {
      if (o === r) continue;
      let inter = 0;
      for (const f of r.fams) if (o.fams.has(f)) inter++;
      const uni = r.fams.size + o.fams.size - inter;
      let tInter = 0;
      for (const t of r.tags) if (o.tags.has(t)) tInter++;
      const tUni = r.tags.size + o.tags.size - tInter;
      let s = 2.2 * (uni ? inter / uni : 0) + 1.2 * (tUni ? tInter / tUni : 0);
      if (o.base === r.base) s += 0.35;
      if (o.cat === r.cat) s += 0.2;
      if (o.zero !== r.zero) s -= 1;
      out.push([s, o]);
    }
    out.sort((a, b) => b[0] - a[0]);
    return out.slice(0, n).map(x => x[1]);
  }

  const api = {
    GROUPS, CATS, GLASSES, METHODS, STRENGTH, FLAVOR_LABELS,
    parseData, fmtItem, itemPlain, steps, orderLine, recipeText, similar, norm, slug, frac, ml, mixColor
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SSCore = api;

  function quizOpt(id) { const q = QUIZ.find(x => x.id === id); return q && q.opts.find(o => o.k === quiz.ans[id]); }
  function scoreAll() {
    const r0 = rng(quiz.seed);
    const jitter = {};
    recipes.forEach(r => { jitter[r.id] = r0(); });
    const mood = quizOpt('mood') || {}, where = quizOpt('where') || {}, flavor = quizOpt('flavor') || {}, str = quizOpt('strength') || {}, sp = quizOpt('spirit') || {};
    const weights = {};
    [mood, where, flavor].forEach(o => Object.entries(o.w || {}).forEach(([k, v]) => { weights[k] = (weights[k] || 0) + v; }));
    const cats = Object.assign({}, where.cats || {});
    const allowShots = !!(mood.shots || where.shots);
    const wantCoffee = !!(mood.coffee || flavor.coffee);
    const target = str.target == null ? 2 : str.target;
    const goal = Math.max(1, Math.min(4, target + (mood.shift || 0)));
    const out = [];
    for (const r of recipes) {
      if (target === 0 ? !r.zero : r.zero) continue;
      if (r.cat === 'shot' && !allowShots) continue;
      if (r.cat === 'coffee' && r.zero && !wantCoffee) continue;
      let s = 0;
      const why = [];
      for (const [t, w] of Object.entries(weights)) if (r.tags.has(t)) { s += w; why.push([w, t]); }
      s = s / Math.sqrt(Math.max(3, r.tags.size)) * 1.6;
      if (cats[r.cat]) s += cats[r.cat];
      if (target > 0) s -= Math.abs(r.strength - goal) * 1.6;

      out.push({ r, s, why: why.slice(0, 3).map(x => C.FLAVOR_LABELS[x[1]]) });

            ['Martini Bar & Crush', 'Ice-topped bar with flair bartenders. Look for evening martini-tower pours.', ['Espresso Martini', 'Lychee Martini', 'Key Lime Pie Martini']],
            ['Sunset Bar', 'Open-air at the back of the ship. Arrive 30 minutes before sunset on sail-away nights.', ['Aperol Spritz', 'Painkiller', 'Rum Runner']],
            ['Pool deck & Solarium', 'Frozen-drink central. The Solarium is adults-only and calmer.', ['Coconut Patrón Margarita', 'Piña Colada', 'Miami Vice']],
            ['Café al Bacio & Gelateria', 'Specialty coffee, covered by Premium, plus gelato.', ['Cappuccino', 'Affogato', 'Iced Latte']],
            ['Cellar Masters', 'The wine bar: by-the-glass pours, flights and tastings.', ['Kir Royale', 'Bellini']],
            ['Ensemble Lounge', 'Live jazz and classic cocktails.', ['French 75', 'Sidecar', 'Negroni']],
            ['Sky Observation Lounge', 'Big windows up top. Afternoon spritzes, evening nightcaps.', ['Hugo Spritz', 'Brandy Alexander']],
            ['Michael\'s Club', 'A quieter, clubby lounge for after dinner.', ['Carajillo', 'Amaro Digestivo', 'Cognac Neat']],
            ['Quasar & late night', 'Dance-floor energy.', ['Lemon Drop Shot', 'Tokyo Tea', 'Vodka Red Bull']],
            ['The Lawn Club', 'Real grass on the top deck.', ['Pimm\'s Cup', 'Hugo Spritz']]
          ].map(([n, d, ds]) => `<div class="bar-item"><b>${esc(n)}</b><p>${esc(d)}</p><div class="linkrow">${ds.map(x => linkTo(x)).join('')}</div></div>`).join('')}
        </div>
        <p class="muted" style="font-size:13px">Venues change after refits. Check the Celebrity app or the daily planner for what's open on your sailing.</p>`)}
      ${sec('ports', 'Port sips: local drinks ashore', PORTS.map(reg => `
        <p class="eyebrow" style="margin-top:6px">${esc(reg.region)}</p>${reg.note ? `<p class="muted" style="font-size:13px">${esc(reg.note)}</p>` : ''}
        ${reg.places.map(p => `<div class="port"><h4>${esc(p.name)}</h4><p class="where">${esc(p.where)}</p><ul>${p.items.map(([n, d, link]) => `<li>${link ? linkTo(link, n) : `<b>${esc(n)}</b>`}: ${esc(d)}</li>`).join('')}</ul></div>`).join('')}`).join('') + '<p class="muted" style="font-size:13px">Drinks ashore are not covered by your package. Keep an eye on all-aboard time.</p>')}
      ${sec('smart', 'Sip smart at sea', `
        <ul class="facts-list">
          ${fact(true, '<b>Alternate with water.</b> Sun, salt air and alcohol dehydrate fast. The tracker nudges you when you\'re two drinks ahead.')}
          ${fact(true, '<b>Watch the strength dots.</b> Some frozen drinks hold 3 oz of liquor and taste like a smoothie.')}
          ${fact(true, '<b>Caffeine hides how drunk you feel</b> (espresso martinis, Vodka Red Bull).')}
          ${fact(true, '<b>Seasickness meds and alcohol</b> make you extra drowsy. Meclizine, Dramamine and scopolamine patches all warn against mixing.')}
          ${fact(true, '<b>Eat first.</b> And set an alarm for all-aboard time on port days.')}
        </ul>
        <p class="muted" style="font-size:13px">"≈1.5 standard drinks" means about 1.5 × 0.6 oz of pure alcohol, using typical bottle strengths.</p>`)}
      ${sec('lingo', 'Bar lingo', `<dl class="gloss">${GLOSSARY.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>`)}
      ${sec('offline', 'Keep it offline', offlineHTML())}
      ${sec('settings', 'Settings & backup', settingsHTML('g'))}
      </div>
      <p class="foot">Sip &amp; Sail · ${TOTAL} recipes · Unofficial guide, not affiliated with Celebrity Cruises. Drink responsibly.</p>`;
    bindSettings($('#v-guide'));
    if (open) { const d = $('#g-' + open); if (d) setTimeout(() => d.scrollIntoView({ block: 'start' }), 30); }
  }
  const SITE = window.SIPSAIL_URL || '';
  function offlineHTML() {
    const link = SITE ? `<b>${esc(SITE.replace(/^https:\/\//, ''))}</b>` : 'the Sip &amp; Sail web link';
    return `<p>Everything (all ${TOTAL} recipes, the quiz, the tracker and this guide) lives inside this one page. Nothing needs the internet once it's on your phone.</p>
      ${SITE ? `<div class="say"><p class="eyebrow">Web link</p><p style="word-break:break-all">${esc(SITE)}</p><div class="btn-row"><button class="btn small" type="button" data-act="copy-site">${I.copy}Copy link</button></div></div>` : ''}
      <ul class="facts-list">
        ${fact(true, `<b>iPhone:</b> open ${link} in Safari, tap Share, then <b>Add to Home Screen</b>. Open it once while online; after that it works in airplane mode.`)}
        ${fact(true, `<b>Android:</b> open ${link} in Chrome, tap ⋮, then <b>Install app</b> or <b>Add to Home screen</b>. Or open the downloaded .html file with Chrome.`)}
        ${fact(true, '<b>Have the .html file?</b> It runs offline in any browser on a laptop or Android. iPhone\'s Files app can\'t run it, so use the web link there.')}
        ${fact(true, '<b>Your data stays on this phone:</b> favorites, ratings, notes and the tracker. Use Backup below to move them to another phone.')}
      </ul>`;
  }
  function settingsHTML(px) {
    const ppl = S.people.concat(['', '', '', '']).slice(0, 4);
    return `<div class="settings-grid">
      <div class="field"><span>Units</span><div class="seg" role="group" aria-label="Units">${[['both', 'oz + ml'], ['oz', 'oz only'], ['ml', 'ml only']].map(([k, l]) => `<button type="button" data-act="set-units" data-k="${k}" aria-pressed="${S.units === k}">${l}</button>`).join('')}</div></div>
      <div class="field"><span>Theme</span><div class="seg" role="group" aria-label="Theme">${[['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button type="button" data-act="set-theme" data-k="${k}" aria-pressed="${S.theme === k}">${l}</button>`).join('')}</div></div>
      <div class="field"><span>Who's drinking (for the tracker)</span><div class="price-grid">${ppl.map((p, i) => `<label class="field" for="${px}-person-${i}"><span class="muted" style="font-size:12px">Person ${i + 1}</span><input id="${px}-person-${i}" data-set="person" data-i="${i}" value="${esc(p)}" placeholder="${i < 2 ? (i ? 'Partner' : 'Me') : 'Optional'}" maxlength="18"></label>`).join('')}</div></div>
      <label class="field" for="${px}-pkg"><span>Your package price per person per day, including gratuity ($)</span><input id="${px}-pkg" data-set="pkg" inputmode="decimal" value="${esc(S.pkg)}" placeholder="e.g. 110"></label>
      <div class="field"><span>Estimated menu prices for the value tracker ($)</span><div class="price-grid">${Object.keys(DEFAULT_PRICES).map(k => `<label class="field" for="${px}-price-${k}"><span class="muted" style="font-size:12px">${PRICE_LABELS[k]}</span><input id="${px}-price-${k}" data-set="price" data-k="${k}" inputmode="decimal" value="${esc(S.prices[k])}"></label>`).join('')}</div></div>
      <div class="field"><span>Backup</span><p class="muted" style="font-size:13px">Copy a backup code and paste it into Restore on another phone or after clearing your browser.</p>
        <div class="btn-row"><button class="btn small" type="button" data-act="backup">${I.copy}Copy backup code</button></div>
        <label class="field" for="${px}-restore"><span class="muted" style="font-size:12px">Restore from backup code</span><textarea id="${px}-restore" class="restore-box" placeholder="Paste a backup code here"></textarea></label>
        <div class="btn-row"><button class="btn small" type="button" data-act="restore">Restore</button><button class="btn small" type="button" data-act="reset">Clear all my data</button></div>
      </div>
    </div>`;
  }
  function bindSettings(root) {
    $$('[data-set]', root).forEach(inp => {
      inp.addEventListener('change', () => {
        const t = inp.dataset.set;
        if (t === 'person') { const i = +inp.dataset.i; const arr = S.people.concat(['', '', '', '']).slice(0, 4); arr[i] = inp.value.trim(); while (arr.length > 1 && !arr[arr.length - 1]) arr.pop(); S.people = arr.length ? arr : ['Me']; }
        else if (t === 'pkg') S.pkg = inp.value.replace(/[^0-9.]/g, '');
        else if (t === 'price') { const v = parseFloat(inp.value); if (!isNaN(v)) S.prices[inp.dataset.k] = v; }
        saveS();
        toast('Settings saved');
      });
    });
  }
  function openSettingsSheet() {
    const el = openOverlay(`<div class="panel" role="dialog" aria-modal="true" aria-label="Settings"><div class="panel-bar"><span class="eyebrow">Settings</span><button class="icon-btn" type="button" data-act="close" aria-label="Close">${I.x}</button></div>${settingsHTML('s')}<h3>Offline</h3>${offlineHTML()}</div>`, { onClose: refresh });
    bindSettings(el);
  }

  // ---------- actions ----------
  let resetArmed = 0;
  const ACT = {
    open: t => { const top = stack[stack.length - 1]; openDrink(t.dataset.id, !!(top && (top.el.dataset.drink || top.el.dataset.spin))); },
    'open-from-spin': t => openDrink(t.dataset.id, true),
    close: () => closeTop(),
    fav: t => toggleFav(t.dataset.id, t),
    log: t => logDrink(t.dataset.id),
    rate: t => setRating(t.dataset.id, +t.dataset.n),
    bartender: t => openBartender(t.dataset.id),
    'bt-units': t => { S.units = t.dataset.k; saveS(); const top = stack[stack.length - 1]; if (top && top.el._draw) top.el._draw(); },
    units: () => { S.units = S.units === 'both' ? 'oz' : S.units === 'oz' ? 'ml' : 'both'; saveS(); const top = stack[stack.length - 1]; const id = top && top.el.dataset.drink; if (id) { const sc = top.el.scrollTop; openDrink(id, true); stack[stack.length - 1].el.scrollTop = sc; } },
    copy: t => { const r = byId.get(t.dataset.id); copyText(C.recipeText(r, ING, S.units), 'Recipe copied'); },
    surprise: () => openSurprise(surpriseMode),
    respin: t => openSurprise(t.dataset.k, true),
    smode: t => { surpriseMode = t.dataset.k; $$('[data-act="smode"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === surpriseMode)); },
    musttab: t => { mustTab = +t.dataset.i; renderHome(); },
    'browse-must': () => go('browse', { reset: true, quick: 'must' }),
    guide: t => go('guide', { sec: t.dataset.sec }),
    settings: () => openSettingsSheet(),
    'offline-help': () => go('guide', { sec: 'offline' }),
    filters: () => openFilters(),
    cat: t => { const k = t.dataset.k; if (!k) F.cats.clear(); else if (F.cats.has(k)) F.cats.delete(k); else F.cats.add(k); $$('[data-act="cat"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k ? F.cats.has(b.dataset.k) : !F.cats.size)); renderResults(); },
    quick: t => { const k = t.dataset.k; if (F.quick.has(k)) F.quick.delete(k); else F.quick.add(k); t.setAttribute('aria-pressed', F.quick.has(k)); renderResults(); },
    more: () => appendMore(),
    rm: t => { const set = F[t.dataset.t]; set.delete(t.dataset.t === 'str' ? +t.dataset.k : t.dataset.k); renderResults(); },
    'clear-filters': () => { F.cats.clear(); F.inc.clear(); F.exc.clear(); F.flav.clear(); F.str.clear(); F.quick.clear(); F.q = ''; renderBrowse(); },
    'clear-filters-sheet': () => { F.inc.clear(); F.exc.clear(); F.flav.clear(); F.str.clear(); const top = stack[stack.length - 1]; $$('.chip', top.el).forEach(c => { c.classList.remove('inc', 'exc'); if (c.hasAttribute('aria-pressed')) c.setAttribute('aria-pressed', 'false'); }); updateFilterSheet(); },
    str: t => { const k = +t.dataset.k; if (F.str.has(k)) F.str.delete(k); else F.str.add(k); t.setAttribute('aria-pressed', F.str.has(k)); updateFilterSheet(); },
    flav: t => { const k = t.dataset.k; if (F.flav.has(k)) F.flav.delete(k); else F.flav.add(k); t.setAttribute('aria-pressed', F.flav.has(k)); updateFilterSheet(); },
    ing: t => { const k = t.dataset.k; if (F.inc.has(k)) { F.inc.delete(k); F.exc.add(k); } else if (F.exc.has(k)) F.exc.delete(k); else F.inc.add(k); t.classList.toggle('inc', F.inc.has(k)); t.classList.toggle('exc', F.exc.has(k)); updateFilterSheet(); },
    anyall: t => { F.any = t.dataset.k === 'any'; $$('[data-act="anyall"]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.k === 'any') === F.any)); updateFilterSheet(); },
    answer: t => answer(t.dataset.q, t.dataset.k),
    'quiz-prev': () => { quiz.step = Math.max(0, quiz.step - 1); renderQuiz(); },
    'quiz-restart': () => { quiz.step = 0; quiz.ans = {}; quiz.result = null; renderQuiz(); },
    'quiz-back': () => { quiz.result = null; renderQuiz(); },
    'quiz-shuffle': () => { quiz.seed = Date.now(); quiz.result = scoreAll(); renderQuiz(); },
    bartab: t => { barTab = t.dataset.k; renderMyBar(); },
    person: t => { S.person = +t.dataset.i; saveS(); renderMyBar(); },
    day: t => { dayOffset = Math.min(0, dayOffset + +t.dataset.d); renderMyBar(); },
    goday: t => { dayOffset = Math.min(0, +t.dataset.d); renderMyBar(); try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } },
    quickadd: t => quickAdd(t.dataset.k),
    'pick-drink': () => openPicker(),
    pick: t => { closeTop(); logDrink(t.dataset.id); },
    unlog: t => { const e = log.find(x => x.id === t.dataset.id); log = log.filter(x => x.id !== t.dataset.id); saveLog(); renderMyBar(); if (e) toast(`Removed ${e.name}`, () => { log.push(e); saveLog(); renderMyBar(); }); },
    'copy-shop': () => copyText(shopText, 'List copied'),
    'copy-site': () => copyText(SITE, 'Link copied'),
    'set-units': t => { S.units = t.dataset.k; saveS(); $$('[data-act="set-units"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.units)); toast('Units updated'); },
    'set-theme': t => { S.theme = t.dataset.k; saveS(); applyTheme(); $$('[data-act="set-theme"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.theme)); },
    backup: () => copyText(JSON.stringify({ app: 'sipsail', v: 1, settings: S, favs: [...favs], tried, log, shop: [...shop] }), 'Backup code copied'),
    restore: t => {
      const box = t.closest('.settings-grid').querySelector('.restore-box'); if (!box) return;
      try {
        const d = JSON.parse(box.value);
        if (d.app !== 'sipsail') throw new Error('not ours');
        Object.assign(S, d.settings || {}); S.prices = Object.assign({}, DEFAULT_PRICES, S.prices || {});
        favs = new Set(d.favs || []); tried = d.tried || {}; log = d.log || []; shop = new Set(d.shop || []);
        saveS(); saveFavs(); saveTried(); saveLog(); saveShop(); applyTheme();
        toast('Backup restored'); box.value = '';
      } catch (e) { toast('That code didn\'t work. Copy the whole backup code and try again.'); }
    },
    reset: t => {
      if (Date.now() - resetArmed > 4000) { resetArmed = Date.now(); t.textContent = 'Tap again to clear everything'; return; }
      favs = new Set(); tried = {}; log = []; shop = new Set();
      saveFavs(); saveTried(); saveLog(); saveShop();
      t.textContent = 'Cleared'; toast('All your data was cleared');
    },
    shopcheck: t => { const k = t.dataset.k; if (t.checked) shop.add(k); else shop.delete(k); saveShop(); t.closest('.shop-item').classList.toggle('done', t.checked); }
  };

  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) {
      if (stack.length) while (stack.length) closeTop();
      go(g.dataset.go);
      return;
    }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const fn = ACT[t.dataset.act];
    if (!fn) return;
    if (t.dataset.act === 'shopcheck') { fn(t, e); return; }
    if (t.tagName === 'A') e.preventDefault();
    fn(t, e);
  });

  // ---------- status & offline ----------
  function setStatus(state) {
    const el = $('#status'); if (!el) return;
    const map = { file: ['ok', 'Offline file'], ready: ['ok', 'Offline ready'], saving: ['', 'Saving offline…'], online: ['', 'Keep offline'] };
    const [cls, label] = map[state] || map.online;
    el.className = 'status-pill ' + cls;
    el.querySelector('span').textContent = label;
  }
  function initOffline() {
    let framed = false;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }
    if (location.protocol === 'file:') { setStatus('file'); return; }
    if (!framed && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && document.querySelector('link[rel="manifest"]')) {
      setStatus(navigator.serviceWorker.controller ? 'ready' : 'saving');
      navigator.serviceWorker.register('sw.js').then(reg => {
        const done = () => setStatus('ready');
        if (reg.active) done();
        navigator.serviceWorker.ready.then(done);
      }).catch(() => setStatus('online'));
      return;
    }
    setStatus('online');
  }

  // ---------- boot ----------
  const setHead = () => { const h = $('.top'); if (h) document.documentElement.style.setProperty('--head-h', h.offsetHeight + 'px'); };
  window.addEventListener('resize', setHead);
  applyTheme();
  buildDefs();
  $('#brand-sub').textContent = `${TOTAL} recipes · no whiskey`;
  if (DATA.errors.length && window.console) console.warn('Sip & Sail data issues:', DATA.errors);
  go(view);
  setHead();
  initOffline();
})();

</script>
</body>
</html>
