<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="glass-defs"></defs></svg>

    <section class="view" id="v-quiz" aria-label="Mood match" hidden></section>
    <section class="view" id="v-mybar" aria-label="My bar" hidden></section>
    <section class="view" id="v-guide" aria-label="Guide" hidden></section>

</div>
